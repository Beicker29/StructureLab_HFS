name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.10"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q
      - name: Oracles reproduce their references
        shell: bash
        run: |
          for oracle in tests/oracles/chapter_*.py; do python "$oracle"; done
          git diff --exit-code -- tests/fixtures
      - name: Build distribution
        run: python -m build
      - name: Run the installed wheel outside the repository
        shell: bash
        run: |
          python -m pip install --target "$RUNNER_TEMP/site" dist/*.whl
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$RUNNER_TEMP/site"
          python -c "import pathlib, steel_design; assert pathlib.Path(steel_design.__file__).parents[1].name == 'site'"
          python -m steel_design.run "$GITHUB_WORKSPACE/examples/channel.json" > /dev/null
