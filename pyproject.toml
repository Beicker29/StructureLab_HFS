[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "structurelab-hfs"
version = "0.3.0"
description = "Steel and composite member strength per ANSI/AISC 360-22, LRFD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1,<3",
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
pdf = [
    "fpdf2==2.9.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "build==1.6.1",
    "fpdf2==2.9.0",
]

[project.scripts]
structurelab-hfs = "steel_design.run:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
steel_design = ["data/*.xlsx"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["steel_design", "steel_design.*"]
namespaces = false

[tool.mypy]
python_version = "3.12"
files = ["src/steel_design"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "fpdf.*"]
ignore_missing_imports = true

# The input declares as optional what each member type requires: a model validator or require_properties() has already checked it
# when these modules read it, which mypy cannot follow. Everything else is still checked here.
[[tool.mypy.overrides]]
module = [
    "steel_design.engine",
    "steel_design.sections.geometry",
    "steel_design.domain.composite.*",
    "steel_design.domain.compression",
    "steel_design.domain.coverage",
    "steel_design.domain.fire",
    "steel_design.domain.interaction",
    "steel_design.domain.interaction_diagram",
    "steel_design.domain.speedcore",
]
disable_error_code = ["union-attr", "operator", "index", "arg-type", "type-var"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["C90", "E4", "E501", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "UP042",  # Status(str, Enum): StrEnum would change str(status)
    "B905",   # zip: lengths come from the same data; strict= would add failure modes to the formulas
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901"]  # tables of cases and oracles by family, read from top to bottom
