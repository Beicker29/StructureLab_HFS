[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "structurelab-hfs"
version = "0.3.0"
description = "Steel and composite member strength per ANSI/AISC 360-22, LRFD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1,<3",
    "openpyxl>=3.1.5,<4",
]

[project.optional-dependencies]
pdf = [
    "fpdf2==2.9.0",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
    "build==1.6.1",
    "fpdf2==2.9.0",
]

[project.scripts]
structurelab-hfs = "steel_design.run:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
steel_design = ["data/*.xlsx"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["steel_design", "steel_design.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "UP042",  # Status(str, Enum): StrEnum would change str(status)
    "B905",   # zip: lengths come from the same data; strict= would add failure modes to the formulas
]
